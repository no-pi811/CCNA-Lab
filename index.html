"9-9":mk("ファイアウォールとIPSの役割を説明できる","<p><b>ファイアウォール</b>は、ルールに従って通信を許可・拒否する機器です。種類:<b>パケットフィルタ</b>(ACLのように1パケットずつ判断)、<b>ステートフル</b>(通信の状態を追跡し、内部から出た通信への<b>戻りを自動で許可</b>)、<b>NGFW</b>(アプリケーションの識別、IPS、URLフィルタなどを持つ次世代型)。</p><p><b>DMZ</b>は、外部に公開するサーバー(Webなど)を置く中間のゾーンで、社内ネットワークとは分けます。</p><p><b>IPS</b>は通信の中の攻撃を検知して<b>遮断</b>し、<b>IDS</b>は検知して<b>通知</b>するだけです。</p>","ビルの入口の警備員です。ステートフルなら、「中から出た人が戻ってくるときは確認なしで通す」ことができます。","公開Webサーバーは、DMZに置き、外部からDMZへの通信は許可、DMZから社内への通信は拒否します。","ファイアウォール/ステートフル/NGFW/DMZ/IPS/IDS","ステートフルは戻りの通信を自動許可、IPSは遮断・IDSは通知、が頻出です。","「ファイアウォールがあればウイルス対策は不要」は誤りです。役割が違います。",[Q("内部から出た通信に対する戻りの通信を、自動で許可するファイアウォールはどれですか。",["ステートフルファイアウォール","ステートレスのパケットフィルタのみ","ハブ","アクセスポイント"],0,"ステートフルは通信の状態を追跡し、戻りを許可します。",["正解です。","戻りを自動許可しません。","通信制御の機能がありません。","無線の接続機器です。"]),Q("IPSとIDSの違いとして正しいものはどれですか。",["IPSは攻撃を遮断でき、IDSは検知して通知する","IDSは攻撃を遮断し、IPSは通知のみ","両方とも通知のみ","両方とも暗号化機器"],0,"IPSは遮断、IDSは検知と通知が基本です。",["正解です。","逆です。","IPSは遮断できます。","暗号化機器ではありません。"],2),Q("外部に公開するサーバーを置く、社内とは分けたゾーンはどれですか。",["DMZ","VLAN1","ループバック","ネイティブVLAN"],0,"外部に公開するサーバーはDMZに置きます。",["正解です。","初期のVLANです。","自分自身を指すアドレスです。","トランクのタグなしVLANです。"],2)])});
Object.assign(L,{
"10-1":mk("Cisco IOSの役割と設定ファイルの置き場所を説明できる","<p><b>Cisco IOS</b>は、Ciscoのルーターやスイッチで動くOSです。操作は主に<b>CLI</b>(文字でコマンドを入力する画面)で行います。</p><p>設定は2種類あります。<b>running-config</b>は、いま動いている設定で<b>RAM</b>にあり、電源を切ると消えます。<b>startup-config</b>は、起動時に読み込まれる設定で<b>NVRAM</b>にあり、電源を切っても残ります。IOS本体は<b>フラッシュ</b>に保存されています。</p><p>初期設定は、<b>コンソールケーブル</b>でPCとつないで行います(端末ソフトの一般的な設定は9600bps、データ8ビット、パリティなし、ストップ1ビット)。</p>","running-configは「作業中のメモ帳」、startup-configは「保存したファイル」のイメージです。保存しないと、電源を切ったときに作業中のメモは消えます。","コマンドで設定を変えると、すぐに動作へ反映されますが、保存しないと再起動で元に戻ります。","IOS/CLI/running-config/startup-config/NVRAM/コンソール","running-configはRAM、startup-configはNVRAM、が頻出です。","「設定を入力すれば自動で保存される」は誤りです。保存のコマンドを実行する必要があります。",[Q("現在動作している設定(running-config)が保存されている場所はどれですか。",["RAM","NVRAM","フラッシュ","ROMのみ"],0,"running-configはRAMにあり、電源を切ると消えます。",["正解です。","startup-configの保存場所です。","IOS本体の保存場所です。","起動用の基本プログラムの場所です。"]),Q("機器の初期設定のために、PCを直接つなぐ接続はどれですか。",["コンソール接続","SSH接続","Telnet接続","HTTPS接続"],0,"初期設定は、ネットワークが未設定でも使えるコンソール接続で行います。",["正解です。","IPアドレスの設定後に使います。","IPアドレスの設定後に使えます。","管理画面を使う場合の方法です。"],2)]),
"10-2":mk("CLIの便利な操作とエラーメッセージを読める","<p>CLIの基本操作です。<br>・<b>?</b>:使えるコマンドや続きの候補を表示する。<code>show ?</code>のように使う。<br>・<b>Tab</b>キー:コマンドを補完する。<br>・<b>短縮入力</b>:一意に決まれば省略できる(<code>conf t</code>=configure terminal)。<br>・<b>↑</b>キー:直前のコマンドを呼び出す。<br>・<b>no</b>:コマンドの設定を取り消す。<br>・<b>do</b>:コンフィグモードのまま特権EXECのコマンドを実行する(<code>do show running-config</code>)。</p><p>エラー:<code>% Incomplete command.</code>=入力が足りない。<code>% Invalid input detected at '^' marker.</code>=^の位置の入力が不正。<code>% Ambiguous command</code>=短縮が曖昧で1つに決まらない。</p>","スマホの入力補完や、履歴の呼び出しと同じように、入力の手間を減らす機能です。","<pre>Router(config)# do show ip interface brief</pre>","?/Tab/no/do/% Incomplete command","エラーメッセージの意味を問う問題が頻出です。","「コマンドは1文字も省略できない」は誤りです。一意に決まる範囲で省略できます。",[Q("「% Incomplete command.」の意味はどれですか。",["コマンドの入力が足りない","コマンドが存在しない","権限がない","機器が故障している"],0,"必要な引数などが足りないときに表示されます。",["正解です。","存在しない場合は、Invalid inputなどです。","権限の話ではありません。","故障のメッセージではありません。"]),Q("グローバルコンフィグモードのまま、show running-configを実行する方法はどれですか。",["do show running-config","enable show running-config","exit show running-config","no show running-config"],0,"doを付けると、特権EXECのコマンドを実行できます。",["正解です。","そのような書き方はありません。","そのような書き方はありません。","noは設定の取り消しです。"],2)]),
"10-4":mk("グローバルコンフィギュレーションモードとサブモードを使い分けられる","<p>特権EXECモードで<code>configure terminal</code>(省略:<code>conf t</code>)を入力すると、<b>グローバルコンフィギュレーションモード</b>(プロンプト<code>Router(config)#</code>)に入り、機器全体の設定ができます。</p><p>ここから、設定対象に応じた<b>サブモード</b>へ進みます。<br><code>interface gigabitethernet0/0</code>→<code>(config-if)#</code>(インターフェース)<br><code>line vty 0 15</code>→<code>(config-line)#</code>(回線)<br><code>router ospf 1</code>→<code>(config-router)#</code>(ルーティング)<br><code>vlan 10</code>→<code>(config-vlan)#</code>(VLAN。一部機種)</p><p><b>exit</b>は1つ前のモードへ、<b>end</b>(またはCtrl+Z)は一気に特権EXECモードへ戻ります。</p>","建物の中で、「全体の管理室」(global)から、各部屋(interface、lineなど)へ移動するイメージです。","<pre>Router# configure terminal\nRouter(config)# interface gigabitethernet0/0\nRouter(config-if)# exit\nRouter(config)# end\nRouter#</pre>","configure terminal/(config-if)#/exit/end","プロンプトの形から、いまのモードを読み取る問題が頻出です。","「(config-if)#でホスト名を変更できる」は誤りです。ホスト名はグローバルコンフィグで設定します。",[Q("プロンプト「Router(config-if)#」のモードはどれですか。",["インターフェースコンフィギュレーションモード","グローバルコンフィギュレーションモード","特権EXECモード","ユーザーEXECモード"],0,"(config-if)#はインターフェース設定のモードです。",["正解です。","(config)#です。","#のみです。","&gt;です。"]),Q("コンフィグのサブモードから、一気に特権EXECモードへ戻るコマンドはどれですか。",["end","exit","enable","disable"],0,"endで特権EXECモードに戻ります。",["正解です。","1つ前のモードへ戻ります。","ユーザーEXECから特権EXECへ入ります。","特権EXECからユーザーEXECへ戻ります。"],2)]),
"10-5":mk("基本設定コマンドの目的を説明できる","<p>よく使う基本コマンドと目的です。<br><code>show running-config</code>=現在の設定を表示する。<br><code>show version</code>=IOSのバージョン、稼働時間などを確認する。<br><code>show ip interface brief</code>=インターフェースの状態とIPを一覧で確認する。<br><code>interface</code>で入り、<code>no shutdown</code>=インターフェースを有効にする(<code>shutdown</code>=無効)。<br><code>description 文字列</code>=インターフェースにメモを付ける。通信には影響しない。<br><code>no ip domain-lookup</code>=打ち間違えたコマンドを名前と解釈してDNS問い合わせで待たされるのを防ぐ。<br><code>copy running-config startup-config</code>=現在の設定を保存する。</p>","description=荷物に貼る付箋、no shutdown=ブレーカーを入れる、のイメージです。付箋を貼っても荷物は動きません。","<pre>Router# show ip interface brief\nInterface         IP-Address   Status  Protocol\nGigabitEthernet0/0  192.168.1.1  up      up</pre>","show/no shutdown/description/no ip domain-lookup","descriptionは動作に影響しない、が頻出です。","「ルーターのインターフェースは、設定すれば自動で有効になる」は誤りです。通常はno shutdownが必要です。",[Q("インターフェースの状態とIPアドレスを一覧で確認するコマンドはどれですか。",["show ip interface brief","show version","show clock","show history"],0,"show ip interface briefで、状態とIPを一覧できます。",["正解です。","IOSの情報です。","時刻です。","入力履歴です。"]),Q("descriptionコマンドの効果はどれですか。",["インターフェースにメモを付ける(通信には影響しない)","通信を暗号化する","IPアドレスを設定する","インターフェースを有効にする"],0,"descriptionは管理用のメモで、通信には影響しません。",["正解です。","暗号化の機能ではありません。","IPはip addressです。","有効化はno shutdownです。"],2),Q("現在の設定を、再起動後も残すために保存するコマンドはどれですか。",["copy running-config startup-config","show running-config","erase startup-config","reload"],0,"copy running-config startup-configで保存します。",["正解です。","表示するだけです。","保存済みの設定を消します。","再起動します。"],2)]),
"10-6":mk("ホスト名を設定し、その役割を説明できる","<p>機器の名前を付けるには、グローバルコンフィグモードで<code>hostname 名前</code>を実行します。プロンプトの表示が名前に変わります。</p><pre>Router(config)# hostname R1\nR1(config)#</pre><p>ホスト名は、見分けやすくするためだけでなく、<b>SSHの鍵の生成</b>にも必要です。ネットワークでは、場所や役割が分かる名前(例:TOKYO-SW1)を付けると、運用がしやすくなります。</p>","自分の名札を付けるイメージです。同じ形の機器が何台もあっても、名札で区別できます。","複数台のルーターにR1、R2と名前を付けると、設定やログを読むときに、どの機器か一目で分かります。","hostname","ホスト名はグローバルコンフィグで設定する、が基本です。","「ホスト名を設定すると、DNSの名前が自動で登録される」は誤りです。別の設定です。",[Q("ホスト名を設定するコマンドを実行するモードはどれですか。",["グローバルコンフィギュレーションモード","ユーザーEXECモード","インターフェースコンフィギュレーションモード","ROMモニターのみ"],0,"hostnameはグローバルコンフィグで設定します。",["正解です。","設定変更はできません。","インターフェース用のモードです。","通常の設定ではありません。"]),Q("hostname R1を設定した直後のグローバルコンフィグのプロンプトはどれですか。",["R1(config)#","R1&gt;","Router(config)#","R1(config-if)#"],0,"プロンプトの名前が変わります。",["正解です。","ユーザーEXECのプロンプトです。","変更前のプロンプトです。","インターフェースのモードです。"],2)]),
"10-7":mk("パスワードとSSHを設定して、安全にリモート接続できる","<p>基本の流れです。<br>①特権EXECの保護:<code>enable secret</code>。<br>②コンソールの保護:<code>line console 0</code>で<code>password</code>と<code>login</code>。<code>login</code>がないとパスワードは求められません。<br>③SSHでのリモート接続:ホスト名とドメイン名→RSA鍵の生成→ユーザー作成→vtyで<code>transport input ssh</code>と<code>login local</code>(7-7で学習)。</p><p>スイッチはL2機器なので、リモート管理には<b>管理用のIPアドレス</b>を<b>SVI</b>に設定します。</p><pre>Switch(config)# interface vlan 1\nSwitch(config-if)# ip address 192.168.1.2 255.255.255.0\nSwitch(config-if)# no shutdown\nSwitch(config)# ip default-gateway 192.168.1.1</pre><p><code>ip default-gateway</code>は、別ネットワークから管理するときの戻りの出口です。</p>","建物の入口(コンソール)と、遠隔の入口(vty)に、それぞれ鍵を付けるイメージです。","スイッチのSVIにIPを設定し、PCからSSHで接続して、設定を行います。","enable secret/line console/login/SVI/ip default-gateway","loginを書き忘れるとパスワードが効かない、が頻出です。","「スイッチはIPアドレスを持たない」は誤りです。管理用にSVIへIPを設定できます。",[Q("コンソール回線にパスワードを設定しても、ログイン時に求められないとき、不足している可能性が高いコマンドはどれですか。",["login","enable","exit","no shutdown"],0,"loginを設定しないと、パスワードの確認が行われません。",["正解です。","特権EXECに入るコマンドです。","モードを戻るコマンドです。","インターフェースの有効化です。"]),Q("L2スイッチにリモート管理用のIPアドレスを設定する場所はどれですか。",["SVI(interface vlan)","物理のアクセスポート","コンソールポート","MACアドレステーブル"],0,"管理用のIPはSVIに設定します。",["正解です。","L2のポートにはIPを設定しません。","コンソールにIPは設定しません。","テーブルは設定の場所ではありません。"],2),Q("SSH接続を使えるようにするために、RSA鍵の生成前に必要なものはどれですか。",["ホスト名とドメイン名","VLANの追加","OSPFの設定","NATの設定"],0,"鍵の生成には、ホスト名とドメイン名が必要です。",["正解です。","直接の条件ではありません。","直接の条件ではありません。","直接の条件ではありません。"],2)])});
Object.assign(L,{
"10-8":mk("インターフェースを設定し、状態表示を読み取れる","<p>インターフェースの基本設定です。</p><pre>Router(config)# interface gigabitethernet0/0\nRouter(config-if)# description LAN-SALES\nRouter(config-if)# ip address 192.168.1.1 255.255.255.0\nRouter(config-if)# no shutdown\n\nSwitch(config)# interface range gigabitethernet0/1 - 4\nSwitch(config-if-range)# switchport mode access</pre><p><code>interface range</code>は、複数のポートをまとめて設定します。ルーターのインターフェースは初期状態で<b>shutdown</b>、スイッチのポートは初期状態で有効です。</p><p><code>show ip interface brief</code>の状態の読み方:<br><b>up/up</b>=正常。<br><b>administratively down/down</b>=<code>shutdown</code>で管理者が無効にしている。<br><b>down/down</b>=物理層の問題(ケーブル抜け、相手の電源断など)。<br><b>up/down</b>=物理は生きているが、データリンク層の問題(設定の不一致など)。</p>","1行目のup/downの組み合わせは、「道が通っているか(物理)」と「その道で話が通じるか(データリンク)」の2段階を表しています。","ルーターのGi0/0がadministratively downなら、no shutdownを実行します。","description/interface range/up/up/administratively down","状態の組み合わせから原因を推測する問題が頻出です。","「down/downなら必ず設定のミス」は誤りです。まず物理層(ケーブル、相手機器)を疑います。",[Q("show ip interface briefで「administratively down」と表示される原因はどれですか。",["shutdownコマンドで無効化されている","ケーブルが抜けている","IPアドレスが重複している","VLANが未作成である"],0,"管理者がshutdownで無効にしている状態です。",["正解です。","ケーブル抜けはdown/downに近い表示です。","IPの重複は別の問題です。","VLANの問題は別の表示です。"]),Q("インターフェースがdown/downのとき、最初に疑うべきことはどれですか。",["物理層(ケーブルや相手機器)","OSPFの設定","ACLの設定","NATの設定"],0,"down/downは物理層の問題が多いです。",["正解です。","L3の話で、物理の状態とは別です。","L3の話で、物理の状態とは別です。","L3の話で、物理の状態とは別です。"],2),Q("複数のポートをまとめて設定するときに使うコマンドはどれですか。",["interface range","interface multiple","interface all-ports","vlan range"],0,"interface rangeで範囲指定します。",["正解です。","存在しないコマンドです。","存在しないコマンドです。","VLANの範囲指定とは別です。"],2)]),
"10-9":mk("VLANを作成し、ポートを割り当てられる","<p>手順:①VLANを作る。②ポートをアクセスポートにして、VLANに割り当てる。③確認する。</p><pre>Switch(config)# vlan 10\nSwitch(config-vlan)# name SALES\nSwitch(config-vlan)# exit\nSwitch(config)# interface gigabitethernet0/1\nSwitch(config-if)# switchport mode access\nSwitch(config-if)# switchport access vlan 10\nSwitch(config-if)# end\nSwitch# show vlan brief</pre><p><code>name</code>はVLANの名前(見分けやすくするためのもの)です。<code>show vlan brief</code>では、VLANの一覧と、アクセスポートの所属が分かります。割り当てがない端末は、初期のVLAN1に属します。VLANを先に作ってから割り当てるのが基本です(機種により自動作成されることもあります)。</p>","部署ごとの部屋を作り(vlan)、社員の席(ポート)をその部屋に割り当てるイメージです。","営業部のPCをつなぐGi0/1をVLAN10に割り当てると、VLAN10の機器とだけ、直接通信できます。","vlan/name/switchport access vlan/show vlan brief","VLANの作成→ポート割り当て→show vlan briefの確認の流れが頻出です。","「VLANの名前が同じなら同じVLAN」は誤りです。VLAN IDで区別されます。",[Q("VLANの一覧とアクセスポートの所属を確認するコマンドはどれですか。",["show vlan brief","show ip route","show version","show clock"],0,"show vlan briefで確認します。",["正解です。","経路表です。","IOSの情報です。","時刻です。"]),Q("ポートをVLAN10のアクセスポートにする正しい手順はどれですか。",["switchport mode access → switchport access vlan 10","switchport mode trunk → switchport trunk vlan 10のみ","ip address vlan 10","vlan access 10"],0,"アクセスポートにして、VLANを割り当てます。",["正解です。","トランクの設定です。","IPの設定です。","そのようなコマンドはありません。"],2)]),
"10-10":mk("IPアドレスを設定できる(ルーター、SVI、IPv6、ホスト)","<p>IPv4:インターフェースで<code>ip address アドレス マスク</code>。ルーターのインターフェースは<code>no shutdown</code>も必要です。DHCPで取得するなら<code>ip address dhcp</code>です。</p><p>IPv6:ルーターでIPv6の転送を有効にするには<code>ipv6 unicast-routing</code>が必要です。インターフェースには<code>ipv6 address 2001:db8:1:1::1/64</code>のように設定します(プレフィックス長を付ける)。</p><pre>Router(config)# ipv6 unicast-routing\nRouter(config)# interface gigabitethernet0/0\nRouter(config-if)# ipv6 address 2001:db8:1:1::1/64\nRouter(config-if)# no shutdown</pre><p>ホスト(PC)には、<b>IPアドレス、マスク、デフォルトゲートウェイ、DNS</b>を設定します。デフォルトゲートウェイは、<b>同じネットワーク内の</b>ルーターのインターフェースのIPです。</p>","住所(IP)と、地域の出入口(ゲートウェイ)の両方を渡さないと、遠くへ手紙を出せません。","PC(192.168.1.10/24)のゲートウェイは、ルーターのGi0/0(192.168.1.1)にします。","ip address/ipv6 address/ipv6 unicast-routing/デフォルトゲートウェイ","ipv6 unicast-routingの有無と、ゲートウェイの設定ミスが頻出です。","「IPv6のアドレスを設定すれば、ルーターが自動でIPv6を転送する」は誤りです。ipv6 unicast-routingが必要です。",[Q("ルーターでIPv6パケットの転送を有効にするコマンドはどれですか。",["ipv6 unicast-routing","ip routing","ipv6 enable のみ","ipv6 address dhcp"],0,"ipv6 unicast-routingで、IPv6のルーティングを有効にします。",["正解です。","IPv4のL3スイッチ向けのコマンドです。","インターフェースでIPv6を有効にするだけで、転送の有効化ではありません。","DHCPで取得する設定です。"]),Q("192.168.1.10/24のPCに設定すべきデフォルトゲートウェイとして適切なものはどれですか。",["192.168.1.1","192.168.2.1","10.0.0.1","192.168.1.255"],0,"同じネットワーク内のルーターのIPが適切です。",["正解です。","別のネットワークで、直接届きません。","別のネットワークで、直接届きません。","ブロードキャストアドレスです。"],2)]),
"10-11":mk("設定を保存・バックアップ・消去できる","<p>設定を保存するコマンドは<code>copy running-config startup-config</code>です(短縮:<code>copy run start</code>、または<code>write memory</code>)。保存しないと、再起動で<b>変更前の設定に戻ります</b>。</p><p>バックアップは、<code>copy running-config tftp:</code>などで、サーバーへ送ります。設定を完全に初期化したいときは、<code>erase startup-config</code>の後に<code>reload</code>します。</p>","文書作成ソフトの「上書き保存」と同じです。保存しないまま電源を落とすと、直前の変更は消えます。","設定を変えたあと、思いどおりにならなければ、保存せずにreloadすれば元の設定に戻せます。","copy running-config startup-config/write memory/erase startup-config/reload","保存コマンドの形と、保存しないと消えること、が頻出です。","「running-configを変更すると、startup-configも自動で変わる」は誤りです。",[Q("設定を保存するコマンドはどれですか。",["copy running-config startup-config","copy startup-config running-config","erase startup-config","show startup-config"],0,"running-configをstartup-configへ保存します。",["正解です。","逆方向のコピーです。","保存済みの設定を消します。","表示するだけです。"]),Q("設定を保存せずにreloadしたとき、どうなりますか。",["startup-configの内容で起動する","running-configの変更が引き継がれる","IOSが消える","VLANだけが保存される"],0,"保存していない変更は失われます。",["正解です。","RAMの内容は消えます。","IOSは消えません。","そのような動作はありません。"],2)]),
"10-12":mk("showコマンドで状態を確認できる","<p>目的別のshowコマンドです。<br><code>show running-config</code>=現在の設定<br><code>show startup-config</code>=保存済みの設定<br><code>show ip interface brief</code>=インターフェースの状態とIP<br><code>show interfaces</code>=詳細(エラー数、帯域など)<br><code>show ip route</code>=経路表<br><code>show vlan brief</code>=VLANの一覧<br><code>show interfaces trunk</code>=トランクの状態<br><code>show mac address-table</code>=MACテーブル<br><code>show version</code>=IOSの版数と稼働時間<br><code>show cdp neighbors</code>=隣接するCisco機器(CDPはCisco独自)</p>","健康診断の検査項目のように、見たい部分ごとにコマンドが違います。","VLANの割り当てが怪しいなら、show vlan briefを見て、ポートの所属を確認します。","show running-config/show ip route/show vlan brief/show interfaces trunk/CDP","「何を確認したいとき、どのshowか」の組み合わせが頻出です。","「show running-configで保存済みの設定が分かる」は誤りです。現在の設定です。保存済みはstartup-configです。",[Q("トランクポートとして動作しているポートを確認するコマンドはどれですか。",["show interfaces trunk","show vlan brief","show ip route","show clock"],0,"show interfaces trunkで確認します。",["正解です。","VLANの一覧です。","経路表です。","時刻です。"]),Q("隣接するCisco機器の情報を表示するコマンドはどれですか。",["show cdp neighbors","show ip ospf database","show access-lists","show ntp status"],0,"CDPで隣接機器を確認します。",["正解です。","OSPFの情報です。","ACLの情報です。","時刻同期の情報です。"],2),Q("IOSのバージョンや稼働時間を確認するコマンドはどれですか。",["show version","show running-config","show mac address-table","show vlan brief"],0,"show versionで確認します。",["正解です。","設定です。","MACテーブルです。","VLANの一覧です。"],2)]),
"10-13":mk("設定ミスを見つけて修正できる","<p>通信できないときは、<b>下の層から</b>確認します。<br>①<code>show ip interface brief</code>:インターフェースがup/upか、IPとマスクは正しいか。<br>②<code>show vlan brief</code>:ポートが正しいVLANか。<br>③<code>show interfaces trunk</code>:トランクで必要なVLANを通しているか。<br>④<code>show ip route</code>:経路があるか。</p><p>設定の一部だけを表示するには、<b>パイプ</b>を使います。<code>show running-config | include ip route</code>(その文字を含む行)、<code>| section ospf</code>(その設定ブロック)、<code>| begin interface</code>(その行から)。</p><p>修正:間違ったコマンドは、頭に<code>no</code>を付けて取り消し(<code>no ip route ...</code>)、正しく入れ直します。<code>ip address</code>などは、再入力すると上書きされます。</p>","工場のライン点検で、「電源→配線→設定」の順に原因を絞るのと同じです。","ルーターのGi0/0が<code>administratively down</code>なら、<code>no shutdown</code>で有効にします。ゲートウェイが違う場合は、ホスト側の設定を直します。","show | include/show | section/no/上書き","下の層(物理)から順に切り分ける、が基本です。","「設定を間違えたら、機器を初期化するしかない」は誤りです。no や上書きで修正できます。",[Q("show running-config | include ip routeの意味はどれですか。",["設定のうち、ip routeを含む行だけを表示する","ip routeを削除する","ip routeを追加する","経路表を表示する"],0,"| includeは、その文字を含む行だけを表示します。",["正解です。","削除はnoを付けます。","追加ではありません。","経路表はshow ip routeです。"]),Q("間違って設定したスタティックルートを取り消す方法はどれですか。",["同じコマンドの頭にnoを付けて実行する","reloadだけを行う","VLANを削除する","show running-configを実行する"],0,"noを付けて取り消します。",["正解です。","保存済みなら元に戻りません。","関係ありません。","表示するだけです。"],2),Q("通信できないとき、最初に確認する順序として適切なものはどれですか。",["物理層→データリンク層→ネットワーク層","アプリ→ネットワーク→物理","ACL→NAT→VLAN","DNS→DHCP→ケーブル"],0,"下の層から順に確認します。",["正解です。","上から確認すると、下層の問題を見落とします。","順序の根拠が弱いです。","順序の根拠が弱いです。"],2)])});
Object.assign(L,{
"11-1":mk("ネットワーク自動化の目的と利点を説明できる","<p><b>ネットワーク自動化</b>は、人が1台ずつ手で行っていた設定や確認を、<b>ソフトウェアに実行させる</b>ことです。利点は、<b>速い</b>こと、<b>設定がそろう(一貫性)</b>こと、<b>人為的なミスが減る</b>こと、台数が増えても対応しやすい(<b>拡張性</b>)ことです。</p><p>さらに進んだ考え方に、<b>インテントベースネットワーク</b>があります。「やりたいこと(意図)」を伝えると、システムが設定を作って実行し、結果も確認します。</p>","手作業で100枚の書類に判子を押すのと、機械に押させるのとの違いです。機械なら速く、同じ位置に押せます。","50台のスイッチに同じVLANを追加するとき、スクリプトで一括で設定し、結果を自動で確認できます。","自動化/一貫性/拡張性/インテントベースネットワーク","自動化の利点(速度、一貫性、ミスの低減)が頻出です。","「自動化すればネットワークの知識は不要」は誤りです。何を自動化するかを決めるのに、知識が必要です。",[Q("ネットワーク自動化の利点として最も適切なものはどれですか。",["作業が速く、設定が一貫する","機器の台数が必ず減る","通信が必ず暗号化される","IPアドレスが不要になる"],0,"速度と一貫性が主な利点です。",["正解です。","台数とは関係ありません。","暗号化の話ではありません。","IPは必要です。"]),Q("インテントベースネットワークの説明として正しいものはどれですか。",["やりたいこと(意図)を伝えると、システムが設定を実現する","MACアドレスを自動で変更する","ケーブルを自動で交換する","電波の周波数を固定する"],0,"意図から設定を作り、実現と検証を行います。",["正解です。","そのような機能ではありません。","物理作業は含みません。","周波数の話ではありません。"],2)]),
"11-2":mk("従来の手動設定と自動化の違いを説明できる","<p><b>従来の方法</b>:管理者が機器ごとにCLIで設定する。時間がかかり、作業者によって手順がぶれ、機器ごとの設定が少しずつ変わる<b>構成のずれ</b>(コンフィギュレーションドリフト)が起きやすい。</p><p><b>自動化</b>:設定の<b>テンプレート</b>やスクリプトを使い、同じ内容を多数の機器へ配る。変更履歴をバージョン管理でき、再現しやすい。</p><p>注意:誤った設定も、自動化すると<b>一気に広がります</b>。事前の検証や、一部の機器から順に適用する段階的な展開が大切です。</p>","手書きで同じ書類を何枚も作る(手動)のと、テンプレートを印刷する(自動)のとの違いです。ただしテンプレートが間違っていたら、全部が間違います。","手動なら、機器ごとにntp serverを設定し、1台だけ抜けることがありますが、自動化ならそれを防げます。","構成のずれ/テンプレート/段階的な展開","自動化のメリットと、誤りが広がるリスクの両面を押さえます。","「自動化は常にミスを減らす」とは限りません。テンプレートの誤りは、全機器に広がります。",[Q("機器ごとの設定が少しずつ異なっていく問題を何と呼びますか。",["構成のずれ(コンフィギュレーションドリフト)","ブロードキャストストーム","アドレス枯渇","ルーティングループ"],0,"構成のずれと呼びます。",["正解です。","スイッチのループで起きる現象です。","IPv4アドレスの不足です。","経路の循環です。"]),Q("自動化の注意点として適切なものはどれですか。",["誤った設定も多数の機器へ一気に広がる","設定が必ず遅くなる","バックアップが不可能になる","CLIが使えなくなる"],0,"検証と段階的な展開が重要です。",["正解です。","通常は速くなります。","バックアップも自動化できます。","CLIも引き続き使えます。"],2)]),
"11-3":mk("コントローラベースネットワークとSDNの基本を説明できる","<p>機器の機能は3つの<b>プレーン</b>に分けられます。<b>データプレーン</b>=実際にパケットを転送する。<b>コントロールプレーン</b>=どう転送するかを決める(ルーティングテーブルやMACテーブルの作成)。<b>管理プレーン</b>=機器を管理する(SSH、SNMPなど)。</p><p><b>SDN</b>(ソフトウェア定義ネットワーク)では、コントロールプレーンを<b>集中コントローラ</b>へ移し、全体を一括で制御します。<b>北向きAPI</b>は、アプリとコントローラの間(REST APIなど)、<b>南向きAPI</b>は、コントローラと機器の間(NETCONF、RESTCONF、OpenFlow、SSHなど)です。</p><p>Ciscoのコントローラ例は<b>Cisco Catalyst Center</b>(旧DNA Center)です。物理ネットワークを<b>アンダーレイ</b>、その上の論理ネットワークを<b>オーバーレイ</b>、全体を<b>ファブリック</b>と呼びます。</p>","従来は各店舗の店長(各ルーター)が判断していたのを、本社のシステム(コントローラ)が全店の判断を一括で行うイメージです。店舗は荷物を運ぶ(転送)ことに集中します。","コントローラにVLANの設定を指示すると、コントローラが対象の機器へ設定を展開します。","データプレーン/コントロールプレーン/管理プレーン/北向きAPI/南向きAPI/アンダーレイ/オーバーレイ","プレーンの役割と、北向き・南向きの方向が頻出です。","「SDNではデータの転送もコントローラが行う」は誤りです。転送は機器(データプレーン)が行います。",[Q("パケットを実際に転送するプレーンはどれですか。",["データプレーン","コントロールプレーン","管理プレーン","アプリケーションプレーン"],0,"データプレーンが転送を担当します。",["正解です。","転送の方法を決める側です。","機器の管理です。","3つのプレーンではありません。"]),Q("コントローラとネットワーク機器の間のAPIはどれですか。",["南向きAPI","北向きAPI","東向きAPI","上向きAPI"],0,"コントローラから機器へは南向きAPIです。",["正解です。","アプリとコントローラの間です。","一般的な用語ではありません。","一般的な用語ではありません。"],2),Q("SDNでコントローラへ集約されるのは、主にどのプレーンの機能ですか。",["コントロールプレーン","データプレーン","物理層のみ","電源管理"],0,"転送の方法を決める機能が集約されます。",["正解です。","転送は各機器が行います。","物理層の機能ではありません。","対象外です。"],2)]),
"11-4":mk("APIとは何かを説明できる","<p><b>API</b>(Application Programming Interface)は、ソフトウェア同士が<b>決まった方法でやり取りする窓口</b>です。ネットワーク機器やコントローラのAPIを使うと、人がCLIを操作する代わりに、プログラムが設定の変更や情報の取得を行えます。</p><p>Webで使うAPIは、<b>HTTP/HTTPS</b>でリクエストを送り、レスポンスを受け取ります。認証には、<b>APIキー</b>や<b>トークン</b>を使います。</p>","レストランの注文用紙のようなものです。決まった書式で注文(リクエスト)すると、料理(レスポンス)が届きます。厨房の中身は見えません。","プログラムがコントローラのAPIに「機器の一覧をください」と依頼し、一覧がJSONで返ってきます。","API/リクエスト/レスポンス/トークン","APIは人ではなく、プログラムが使う窓口、が基本です。","「APIはGUI画面のこと」は誤りです。APIはプログラムが使う窓口です。",[Q("APIの説明として最も適切なものはどれですか。",["ソフトウェア同士がやり取りするための決まった窓口","ルーターのLANポート","ケーブルの規格","画面のデザイン"],0,"APIはソフトウェア間のやり取りの窓口です。",["正解です。","物理ポートではありません。","物理規格ではありません。","画面のデザインではありません。"]),Q("Web APIが一般的に使う通信プロトコルはどれですか。",["HTTP/HTTPS","ARP","STP","DHCP"],0,"Web APIはHTTP/HTTPSで通信します。",["正解です。","L2の名前解決です。","ループ防止です。","アドレスの配布です。"],2)]),
"11-5":mk("JSONの書き方を読み書きできる","<p><b>JSON</b>は、データを表す軽量な形式で、APIでよく使われます。構造:<b>オブジェクト</b>=<code>{ }</code>で囲み、<b>キーと値</b>の組を<code>\"キー\": 値</code>の形で並べる。<b>配列</b>=<code>[ ]</code>で囲み、値を並べる。値は、文字列(<b>二重引用符</b>)、数値、true/false、null、オブジェクト、配列です。項目の区切りは<b>コンマ</b>で、<b>最後の要素の後ろにコンマは付けません</b>。</p><pre>{\n  \"hostname\": \"R1\",\n  \"interfaces\": [\n    {\"name\": \"Gi0/0\", \"ip\": \"192.168.1.1\", \"enabled\": true},\n    {\"name\": \"Gi0/1\", \"ip\": \"10.0.0.1\", \"enabled\": false}\n  ]\n}</pre>","名札のついた引き出し(キー)に、中身(値)が入っているイメージです。","上の例は、R1というホスト名の機器に、2つのインターフェースがある、という情報です。","JSON/オブジェクト/配列/キーと値","キーは二重引用符、配列は[ ]、オブジェクトは{ }、が頻出です。","「JSONの文字列は単一引用符でもよい」は誤りです。二重引用符を使います。",[Q("JSONで、キーと値の組の集まり(オブジェクト)を囲む記号はどれですか。",["{ }","[ ]","( )","< >"],0,"オブジェクトは{ }で囲みます。",["正解です。","配列です。","JSONでは構造に使いません。","JSONでは構造に使いません。"]),Q("JSONの配列を表す記号はどれですか。",["[ ]","{ }","( )","/* */"],0,"配列は[ ]で囲みます。",["正解です。","オブジェクトです。","JSONでは使いません。","コメントの書き方で、JSONでは使えません。"],2),Q("JSONの文字列を囲む引用符はどれですか。",["二重引用符","単一引用符のみ","どちらも使えない","バッククォート"],0,"文字列とキーは二重引用符で囲みます。",["正解です。","JSONでは使えません。","使います。","JSONでは使えません。"],2)]),
"11-6":mk("REST APIのメソッドとステータスコードを説明できる","<p><b>REST API</b>は、HTTPを使い、<b>リソース</b>(機器、インターフェースなど)を<b>URI</b>で指定して操作する方式です。主な操作(CRUD)とHTTPメソッドの対応:<br><b>作成</b>=<b>POST</b>、<b>取得</b>=<b>GET</b>、<b>更新</b>=<b>PUT</b>(置き換え)/<b>PATCH</b>(一部の更新)、<b>削除</b>=<b>DELETE</b>。</p><p>主なステータスコード:<b>200</b> OK(成功)、<b>201</b> Created(作成成功)、<b>400</b> Bad Request(要求が不正)、<b>401</b> Unauthorized(認証が必要)、<b>404</b> Not Found(リソースがない)、<b>500</b> Internal Server Error(サーバー側の障害)。データはJSONまたはXMLで受け渡します。</p>","ファイル管理と同じで、「新規作成、読み取り、更新、削除」の4つの操作です。","<pre>GET /api/interfaces/Gi0/0\n→ 200 OK と、インターフェースの情報(JSON)が返る</pre>","REST/GET/POST/PUT/PATCH/DELETE/ステータスコード","CRUDとHTTPメソッドの対応、ステータスコードの意味が頻出です。","「GETはデータを変更する」は誤りです。GETは取得のためのもので、変更はしません。",[Q("リソースを取得するHTTPメソッドはどれですか。",["GET","POST","PUT","DELETE"],0,"GETで取得します。",["正解です。","主に作成です。","更新(置き換え)です。","削除です。"]),Q("HTTPステータスコード404の意味はどれですか。",["リソースが見つからない","成功","認証が必要","サーバーの内部エラー"],0,"404はNot Foundです。",["正解です。","200です。","401です。","500です。"],2),Q("リソースを削除するHTTPメソッドはどれですか。",["DELETE","GET","PATCH","POST"],0,"DELETEで削除します。",["正解です。","取得です。","一部の更新です。","作成です。"],2)]),
"11-7":mk("構成管理ツール(Ansible、Puppet、Chef)の違いを説明できる","<p><b>構成管理ツール</b>は、多数の機器の設定を、決めた状態にそろえて保つためのソフトウェアです。<br><b>Ansible</b>:<b>エージェント不要</b>で、SSHなどで機器へ接続し、<b>YAML</b>で書いた<b>Playbook</b>を実行する。管理側から押し出す<b>push型</b>。<br><b>Puppet</b>:機器側に<b>エージェント</b>を入れ、機器が管理サーバーから設定を取りに行く<b>pull型</b>。<br><b>Chef</b>:エージェントを使い、<b>pull型</b>。Rubyベースで記述する。</p><p><b>NETCONF</b>と<b>RESTCONF</b>は、機器の設定をAPIで扱うプロトコルで、設定の構造は<b>YANG</b>というデータモデルで記述します。</p>","Ansibleは「管理者が各店舗へ指示書を届ける」、PuppetやChefは「店舗が定期的に本部へ最新の指示書を取りに行く」イメージです。","Ansibleで、全スイッチのVLAN設定を書いたPlaybookを実行すると、一斉に同じ状態にそろえられます。","Ansible/Puppet/Chef/Playbook/YANG/NETCONF/RESTCONF","Ansible=エージェントレスでpush、PuppetとChef=エージェントでpull、が頻出です。","「Ansibleは機器にエージェントのインストールが必須」は誤りです。エージェント不要が特徴です。",[Q("エージェントを使わず、YAMLのPlaybookで機器を設定するツールはどれですか。",["Ansible","Puppet","Chef","SNMP"],0,"Ansibleはエージェントレスです。",["正解です。","エージェントを使います。","エージェントを使います。","監視のプロトコルです。"]),Q("機器の設定データの構造を記述する、NETCONFやRESTCONFで使われるデータモデル言語はどれですか。",["YANG","JSON のみ","CSMA/CA","PortFast"],0,"YANGで設定データのモデルを記述します。",["正解です。","データの書き方の1つですが、モデル記述言語ではありません。","無線の衝突回避方式です。","STPの機能です。"],2)])});
Object.assign(L,{
"12-1":mk("通信できない原因を段階的に切り分けられる","<p>通信できないときは、<b>近い所から遠い所へ</b>順にpingで確認し、どこで止まるかを調べます。<br>①<code>ipconfig</code>(Windows)でIP、マスク、ゲートウェイ、DNSを確認。<br>②<code>ping 127.0.0.1</code>=自分のTCP/IPが動作しているか。<br>③自分のIPにping。④<b>ゲートウェイ</b>にping。⑤<b>外部のIPアドレス</b>にping。⑥<b>名前</b>でping(DNSの確認)。</p><p>止まった場所で原因の範囲が絞れます。例えば、「ゲートウェイにはpingが通るが、外部IPは通らない」なら、ルーターより先(経路、NAT、回線)を疑います。「IPでは通るが名前では通らない」なら、DNSを疑います。</p>","水道の故障で、蛇口、家の元栓、道路の水道管、と順に調べて、どこまで水が来ているかを見るのと同じです。","PCからゲートウェイへのpingは成功、8.8.8.8は失敗、という結果なら、PCの設定は正しく、ルーターから先に原因があります。","ping/ipconfig/切り分け","どこまでpingが通るかで、原因を絞り込む、が基本です。","「pingが通らない=相手の故障」とは限りません。経路、ACL、ファイアウォールなどの原因もあります。",[Q("ゲートウェイへのpingは成功し、外部のIPアドレスへのpingは失敗しました。最も疑うべきものはどれですか。",["ルーターより先(経路、NAT、回線など)","PCのNICの故障","PCのキーボード","LAN内のスイッチのポート"],0,"ゲートウェイまでは届くので、その先を疑います。",["正解です。","ゲートウェイまで通っているため、可能性は低いです。","通信とは無関係です。","ゲートウェイまで通っているため、可能性は低いです。"]),Q("IPアドレスへのpingは成功しますが、ドメイン名では失敗します。疑うべきものはどれですか。",["DNS","スイッチのVLAN","ケーブルの断線","STP"],0,"名前解決(DNS)の問題の典型的な症状です。",["正解です。","IPで通るので、物理やL2は問題ありません。","IPで通るので、物理やL2は問題ありません。","IPで通るので、ループの問題ではありません。"],2),Q("ping 127.0.0.1で確認できることはどれですか。",["自分自身のTCP/IPスタックが動作していること","ゲートウェイの動作","DNSサーバーの動作","インターネットへの接続"],0,"127.0.0.1はループバックで、自分自身のTCP/IPの動作を確認できます。",["正解です。","ゲートウェイのIPにpingします。","DNSサーバーのIPにpingします。","外部のIPにpingします。"],2)]),
"12-2":mk("IPアドレスの設定ミスを見抜ける","<p>典型的なミスです。<br>①<b>マスクの誤り</b>:同じネットワークのはずが、別のネットワークと判断される。<br>②<b>ゲートウェイが別ネットワーク</b>:同じLAN内は通信できるが、外へ出られない。<br>③<b>IPの重複</b>:通信が不安定になり、警告が出ることもある。<br>④<b>169.254.x.x</b>:DHCPから取得できていない。</p><p>例:PC-A=192.168.1.130/25、PC-B=192.168.1.20/25。/25のブロックは0〜127と128〜255。PC-Aは128〜255、PC-Bは0〜127にあるため、<b>別のネットワーク</b>です。ルーターなしでは通信できません。</p>","住所を書くとき、町名を間違えると届かないのと同じです。","PC(192.168.1.10/24)のゲートウェイを192.168.2.1にすると、ルーターへ送れず、外部に出られません。","マスク誤り/重複IP/ゲートウェイ誤り/169.254.x.x","サブネット計算が、トラブルシューティングでも使われます。","「同じ192.168.1.xなら必ず同じネットワーク」は誤りです。マスクで判断します。",[Q("PC-A(192.168.1.130/25)とPC-B(192.168.1.20/25)について正しい説明はどれですか。",["別のネットワークにあり、ルーターなしでは通信できない","同じネットワークにあり、直接通信できる","どちらもブロードキャストアドレスである","どちらもネットワークアドレスである"],0,"/25のブロックは0〜127と128〜255で、130と20は別のブロックです。",["正解です。","別のブロックなので誤りです。","どちらもホストアドレスです。","どちらもホストアドレスです。"]),Q("同じLAN内のPCとは通信できますが、外部ネットワークには通信できません。設定の誤りとして最も可能性が高いものはどれですか。",["デフォルトゲートウェイ","MACアドレス","ポート番号","VLANのname"],0,"LAN内の通信は直接で、外へはゲートウェイが必要です。",["正解です。","通常は自動で決まります。","通信先のアプリの話です。","通信には影響しません。"],2)]),
"12-3":mk("VLANの設定ミスを見抜ける","<p>同じスイッチにつないだPC同士が通信できないときは、VLANを疑います。典型的な原因:<br>①ポートが<b>違うVLAN</b>に割り当てられている。<br>②VLANが<b>未作成</b>。<br>③<b>トランク</b>で必要なVLANが許可されていない。<br>④両端の<b>ネイティブVLANが不一致</b>。<br>⑤片側がアクセス、片側がトランクになっている。</p><pre>Switch# show vlan brief\nVLAN Name     Status  Ports\n1    default  active  Gi0/3\n10   SALES    active  Gi0/1\n20   HR       active  Gi0/2</pre><p>PC-1がGi0/1(VLAN10)、PC-2がGi0/2(VLAN20)につながっていると、<b>別のVLAN</b>なので直接通信できません。修正は、Gi0/2で<code>switchport access vlan 10</code>です。</p>","部署ごとに壁で区切った部屋に、別の部署の人が入ってしまっているイメージです。","show interfaces trunkで、Vlans allowed on trunkに必要なVLANが含まれているかを確認します。","show vlan brief/show interfaces trunk/ネイティブVLAN不一致","VLANの所属とトランクの許可VLANの確認が頻出です。","「VLANを作れば自動でトランクが通る」は誤りです。トランク側の許可も必要です。",[Q("PC-1がVLAN10、PC-2がVLAN20のポートにつながっています。この2台について正しい説明はどれですか。",["ルーターなどのL3機能がないと通信できない","同じスイッチなので必ず通信できる","MACアドレスが同じなので通信できない","ケーブルが長いため通信できない"],0,"別のVLANは別のネットワークで、通信にはL3機能が必要です。",["正解です。","VLANが違えば直接通信できません。","MACが同じとは限りません。","距離の問題ではありません。"]),Q("トランクを通して他のスイッチのVLAN30の端末と通信できません。確認すべきコマンドはどれですか。",["show interfaces trunk","show ip dhcp binding","show ntp status","show cdp"],0,"トランクで許可されているVLANを確認します。",["正解です。","DHCPの確認です。","時刻同期の確認です。","隣接機器の確認で、VLANの許可は分かりません。"],2)]),
"12-4":mk("デフォルトゲートウェイの設定ミスを見抜ける","<p>症状:<b>同じネットワーク内はpingが通る</b>のに、<b>別のネットワークはまったく通らない</b>。</p><p>原因の例:①PCのゲートウェイが、<b>ルーターのIPと違う</b>(例:ルーターは192.168.1.1なのに、192.168.1.254を設定)。②ゲートウェイが<b>別のネットワークのアドレス</b>。③DHCPプールの<code>default-router</code>が誤り(全クライアントに誤りが配られる)。④L3スイッチで<code>ip routing</code>が未設定。</p><p>確認:PCの<code>ipconfig</code>でゲートウェイを見て、ルーターのインターフェースのIPと一致するかを<code>show ip interface brief</code>で比べます。</p>","地域の出入口(ゲートウェイ)の場所を間違えて覚えていると、地域の外には出られません。","<pre>Router(dhcp-config)# default-router 192.168.1.1</pre>","default-gateway/default-router/ip routing","「LAN内OK、外NG」の症状は、まずゲートウェイを疑います。","「ゲートウェイを設定すれば、必ず外部に出られる」は誤りです。ルーターの経路やNATも必要です。",[Q("DHCPのプールで、クライアントに配るゲートウェイを指定するコマンドはどれですか。",["default-router","dns-server","network","lease"],0,"default-routerでゲートウェイを指定します。",["正解です。","DNSサーバーの指定です。","配布する範囲の指定です。","貸し出し期間の指定です。"]),Q("LAN内のpingは成功し、外部のpingがすべて失敗しています。最初に確認すべきものはどれですか。",["PCのデフォルトゲートウェイ","PCの壁紙","ポート番号","SNMPのコミュニティ"],0,"LAN内OK、外NGなら、ゲートウェイの設定を疑います。",["正解です。","関係ありません。","関係ありません。","関係ありません。"],2)]),
"12-5":mk("ルーティングの問題を見抜ける","<p>よくある原因です。<br>①宛先への<b>経路がない</b>(<code>show ip route</code>で確認)。<br>②<b>戻りの経路がない</b>(往きは届くが返信が届かない)。<br>③スタティックルートの<b>ネクストホップやマスクの誤り</b>。<br>④<b>最長一致</b>により、より具体的な誤った経路が優先される。<br>⑤<b>OSPFの隣接が確立しない</b>:Hello/Dead時間の不一致、エリアIDの不一致、同じサブネットにいない、networkコマンドの誤り。</p><p>確認:<code>show ip route</code>、<code>show ip ospf neighbor</code>、<code>traceroute</code>。</p>","配達先の道が地図にない、帰り道が地図にない、といった違いです。","往きの経路だけを設定して、相手ルーターに戻りの経路を設定しないと、pingの返事が返りません。","経路なし/戻り経路/ネクストホップ誤り/OSPF隣接","「片道だけ」の症状は戻り経路の不足、が頻出です。","「pingが失敗するのは、必ず自分から宛先への経路がないから」は誤りです。戻りの経路も原因になります。",[Q("OSPFの隣接が確立しない原因として適切なものはどれですか。",["Hello/Dead時間やエリアIDの不一致","PCの壁紙の違い","ケーブルの色の違い","DNSのAレコードの誤り"],0,"OSPFでは、Hello/Dead時間やエリアIDなどが一致する必要があります。",["正解です。","関係ありません。","関係ありません。","名前解決の話で、隣接には関係ありません。"]),Q("PC-Aからサーバーへのpingが失敗しますが、サーバー側のログには受信の記録があります。疑うべきものはどれですか。",["サーバーからPC-Aへの戻りの経路","PCのキーボード","VLANのname","SNMPのバージョン"],0,"往きは届いているため、戻りの経路を疑います。",["正解です。","関係ありません。","関係ありません。","関係ありません。"],2),Q("宛先10.1.1.5に対し、10.1.1.0/24と10.0.0.0/8の経路があります。選ばれるのはどれですか。",["10.1.1.0/24","10.0.0.0/8","どちらも使われない","ランダム"],0,"最長一致で、より具体的な/24が選ばれます。",["正解です。","一致の長さが短いです。","どちらも一致します。","ランダムではありません。"],2)]),
"12-6":mk("DNSとDHCPの問題を見抜ける","<p><b>DHCPの問題</b>:クライアントが<b>169.254.x.x</b>になる。原因の例:DHCPサーバーに届かない(VLAN違い、ケーブル)、サーバーが別ネットワークなのに<code>ip helper-address</code>がない、プールの<b>アドレス枯渇</b>、DHCPスヌーピングのtrust設定の誤り。確認:<code>show ip dhcp binding</code>。</p><p><b>DNSの問題</b>:<b>IPアドレスでは通信できる</b>のに、<b>名前では失敗</b>する。原因の例:DNSサーバーのアドレスが誤り、DNSサーバーに到達できない。確認:<code>nslookup 名前</code>、<code>ipconfig /all</code>。</p>","DHCPは「入居時に部屋を割り当てる受付」、DNSは「名前から部屋番号を調べる案内係」です。受付に届かなければ部屋が決まらず、案内係に届かなければ名前で探せません。","別のネットワークのDHCPサーバーを使うVLANのゲートウェイには、ip helper-addressが必要です。","169.254.x.x/アドレス枯渇/ip helper-address/nslookup","症状から、DHCPかDNSかを判別する問題が頻出です。","「DNSが不通ならインターネット全体が使えない」は誤りです。IPアドレス指定なら通信できます。",[Q("クライアントのIPアドレスが169.254.x.xになっていました。最も疑うべきものはどれですか。",["DHCPからアドレスを取得できていない","DNSサーバーの障害","NTPの時刻のずれ","STPのループ"],0,"169.254.x.xはDHCPから取得できなかった場合の自動割り当てです。",["正解です。","名前解決の問題で、IP取得とは別です。","時刻とは別です。","直接の原因ではありません。"]),Q("別のネットワークにあるDHCPサーバーを使うために、クライアント側のルーターに設定するものはどれですか。",["ip helper-address","ip nat inside","ip route 0.0.0.0 0.0.0.0","switchport mode trunk"],0,"ip helper-addressで、DHCPのブロードキャストをサーバーへ転送します。",["正解です。","NATの設定です。","デフォルトルートの設定です。","スイッチのトランク設定です。"],2),Q("名前解決の状況を調べるコマンドはどれですか。",["nslookup","show vlan brief","show mac address-table","show ip route"],0,"nslookupでDNSの応答を確認します。",["正解です。","VLANの確認です。","MACテーブルの確認です。","経路表の確認です。"],2)]),
"12-7":mk("ACLによる通信制限の問題を見抜ける","<p>症状:<b>pingは通るがWebだけ通らない</b>など、<b>特定の通信だけ</b>失敗する。ACLを疑います。</p><p>よくあるミス:①<b>暗黙のdeny any</b>を忘れて、permitを書いていない。②<b>順序</b>:広いpermitが先にあり、後ろのdenyが効かない。③<b>方向(in/out)</b>や<b>適用するインターフェース</b>の誤り。④標準ACLを送信元に近い所に置いて、必要な通信まで止める。</p><pre>access-list 100 deny tcp any any eq 80\naccess-list 100 permit ip any any</pre><p>確認:<code>show access-lists</code>(各行の一致数)、<code>show ip interface gigabitethernet0/1</code>(どのACLが、どの向きで適用されているか)。</p>","入口の警備員の名簿が、「通す人」だけで終わっていれば、名簿にない人は全員通れません(暗黙のdeny)。","上のACLはTCP/80(HTTP)を拒否し、それ以外は許可します。pingは通り、HTTPは失敗します。","show access-lists/暗黙のdeny/in・out","ACLの順序と、暗黙のdenyが頻出です。","「ACLを削除すると、必ず通信が止まる」は誤りです。ACLがなければ、そのフィルタリングはありません。",[Q("pingは成功しますが、Webページが表示されません。ACLにどのような拒否が入っていると考えられますか。",["TCP/80または443の拒否","ICMPの許可","ARPの許可","VLAN1の許可"],0,"Webは主にTCP/80と443で、これが拒否されている可能性があります。",["正解です。","pingが通っているため、ICMPは許可されています。","ARPはACLで通常制御しません。","VLANの話です。"]),Q("ACLに「access-list 10 permit 192.168.1.0 0.0.0.255」だけを書いて適用しました。192.168.2.0/24からの通信はどうなりますか。",["暗黙のdenyで拒否される","許可される","ランダムに処理される","ACLが無効になる"],0,"一致する行がなければ、暗黙のdeny anyで拒否されます。",["正解です。","許可する行がありません。","ランダムではありません。","無効にはなりません。"],2),Q("どのACLがどの方向で適用されているかを確認するコマンドはどれですか。",["show ip interface","show vlan brief","show cdp neighbors","show clock"],0,"show ip interfaceで、ACLの適用状況を確認できます。",["正解です。","VLANの一覧です。","隣接機器の情報です。","時刻です。"],2)]),
"12-8":mk("showコマンドで原因を絞り込める","<p>症状から、見るべきコマンドを選びます。<br>・インターフェース:<code>show ip interface brief</code>、<code>show interfaces</code><br>・VLANとトランク:<code>show vlan brief</code>、<code>show interfaces trunk</code><br>・スイッチの転送:<code>show mac address-table</code><br>・経路:<code>show ip route</code>、<code>show ip ospf neighbor</code><br>・ACL:<code>show access-lists</code><br>・DHCP:<code>show ip dhcp binding</code><br>・NAT:<code>show ip nat translations</code><br>・隣接機器:<code>show cdp neighbors</code></p><p>経路の途中で止まっている場所は、<code>traceroute</code>(Windowsは<code>tracert</code>)で調べます。応答が途切れたホップの<b>次の機器</b>(または、そこへの経路や戻り)が怪しいです。</p>","医者が症状に合わせて検査を選ぶのと同じです。全部調べるのではなく、見たい部分に合わせて選びます。","3ホップ目まで応答があり、4ホップ目で止まるなら、3ホップ目のルーターが4ホップ目へ転送できていない(経路やACL)か、戻りに問題があります。","show/traceroute/tracert","症状→コマンドの対応が頻出です。","「show running-configさえ見れば、すべての状態が分かる」は誤りです。動作中の状態は、別のshowコマンドで確認します。",[Q("NATで変換が行われているかを確認するコマンドはどれですか。",["show ip nat translations","show vlan brief","show ntp status","show access-lists"],0,"show ip nat translationsで、変換テーブルを確認します。",["正解です。","VLANの一覧です。","時刻同期の確認です。","ACLの確認です。"]),Q("スイッチが、あるMACアドレスをどのポートで学習しているかを確認するコマンドはどれですか。",["show mac address-table","show ip route","show version","show running-config | include ip route"],0,"show mac address-tableで確認します。",["正解です。","経路表です。","IOSの情報です。","経路の設定を探すコマンドです。"],2),Q("tracerouteで、3ホップ目までは応答があり、4ホップ目以降の応答がありません。疑うべき場所はどれですか。",["3ホップ目のルーターから先の経路や、フィルタ、戻り","1ホップ目のスイッチのケーブルの色","DNSのキャッシュ","PCのキーボード"],0,"応答が途切れる境目の先を疑います。",["正解です。","関係ありません。","IPで調べているため、DNSの問題ではありません。","関係ありません。"],2)]),
"12-9":mk("複数の知識を組み合わせて総合的に解決できる","<p>実際のトラブルは、<b>複数の知識</b>を組み合わせて解決します。基本の流れ:<br>①症状を正確に把握する(誰が、どこへ、何ができないか)。<br>②<b>下の層から</b>確認する(物理→VLAN/L2→IP/経路→サービス(DNS/DHCP/NAT/ACL))。<br>③仮説を立てて、showコマンドで確かめる。<br>④<b>1つずつ修正</b>して、直ったか確認する。<br>⑤直ったら、<b>設定を保存</b>する。</p>","複雑な機械の故障と同じで、1つずつ原因を消していく考え方が、いちばん確実です。","総合問題では、これまでの章(アドレス、VLAN、ルーティング、サービス、セキュリティ、コマンド)の知識を組み合わせて考えます。","切り分け/仮説→確認→修正/設定の保存","どの層の問題かを見極める力が、総合問題の鍵です。","「複数の設定を一度に変えると、早く直る」は誤りです。原因が分からなくなるため、1つずつ直します。",[Q("VLAN10のPC(192.168.10.10/24、GW 192.168.10.1)が、VLAN20のサーバー(192.168.20.5)へpingできません。PCからGWへのpingは成功します。ルーターオンアスティックの設定で、最も疑うべきものはどれですか。",["VLAN20のサブインターフェースのencapsulation dot1Q 20とIP","PCの壁紙","NTPのサーバー設定","SNMPのコミュニティ"],0,"VLAN間のルーティングが失敗しているので、VLAN20側のサブインターフェースを疑います。",["正解です。","関係ありません。","直接の原因ではありません。","直接の原因ではありません。"],3),Q("PATの設定で、ACLが「access-list 1 permit 192.168.1.0 0.0.0.255」だけです。192.168.2.10のPCだけがインターネットに出られません。原因として最も適切なものはどれですか。",["ACLに192.168.2.0/24が含まれていない","PCのMACアドレスが長すぎる","ネイティブVLANが不一致","NTPの時刻のずれ"],0,"NATの対象を決めるACLに、192.168.2.0/24がありません。",["正解です。","MACの長さは関係ありません。","直接の原因ではありません。","直接の原因ではありません。"],3),Q("ホストが169.254.x.xになっています。DHCPサーバーは別ネットワークにあり、他のVLANのクライアントは正常です。原因として最も可能性が高いものはどれですか。",["このVLANのゲートウェイにip helper-addressがない","DNSのAレコードが誤っている","ACLが標準ACLである","OSPFのエリアが0である"],0,"VLANごとのゲートウェイにip helper-addressが必要です。",["正解です。","名前解決の問題で、IP取得とは別です。","直接の原因ではありません。","OSPFのエリアは関係ありません。"],3),Q("原因を特定して設定を直しました。最後にすべきことはどれですか。",["通信を確認し、設定を保存する","すぐに機器を初期化する","別の設定も一緒に変える","ログを消去する"],0,"確認後、copy running-config startup-configで保存します。",["正解です。","直ったのに初期化する必要はありません。","新しい問題の原因になります。","調査の記録を失います。"],2)])});
const ADD=(u,q)=>L[u].q.push(q),O=(q,items,e,d)=>({t:"order",q,items,e,d}),C=(q,ans,e,d)=>({t:"cmd",q,ans,e,d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),norm=s=>String(s).trim().replace(/\s+/g," ").toLowerCase();
function judge(q){if(q.t==="order")return Qs.sel.length===q.items.length&&Qs.sel.every((s,n)=>s===n);if(q.t==="cmd")return q.ans.some(a=>norm(a)===norm(Qs.txt||""));return Qs.p===q.a}
function quizX(q){if(q.t==="order"&&!Qs.sh){Qs.sh=q.items.map((_,i)=>i).sort(()=>Math.random()-.5);Qs.sel=[]}
const ok=Qs.done&&Qs.res[Qs.res.length-1],hd=`<div class="dim">${Qs.i+1}/${Qs.l.length}・${NAME(q.u)}・難易度${"★".repeat(q.d||1)}・${q.t==="order"?"並べ替え":"コマンド入力"}・オリジナル練習問題</div>`;let b=`<b>${q.q}</b>`,can;
if(q.t==="order"){const u=Qs.sel;can=u.length===q.items.length;b+=`<div class="dim">下の項目を、正しい順にタップしてください。</div><div class="card" style="background:var(--l)">${u.length?u.map((s,n)=>`<div>${n+1}. ${q.items[s]}${Qs.done?(s===n?" ✅":" ❌"):""}</div>`).join(""):"(まだ選んでいません)"}</div>`+Qs.sh.filter(i=>!u.includes(i)).map(i=>`<button class="opt" ${Qs.done?"disabled":""} onclick="Qs.sel.push(${i});view()">${q.items[i]}</button>`).join("")+(Qs.done?"":`<button class="btn s" onclick="Qs.sel.pop();view()">1つ戻す</button><button class="btn s" onclick="Qs.sel=[];view()">やり直し</button>`)}
else{can=!!(Qs.txt||"").trim();b+=`<div class="dim">コマンドを入力してください(大文字・小文字は区別しません)。</div><input id="ci" style="width:100%;font:16px monospace;padding:12px;border:2px solid var(--bd);border-radius:10px" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(Qs.txt||"")}" ${Qs.done?"disabled":""} oninput="Qs.txt=this.value;document.querySelector('#cb').disabled=!this.value.trim()" onkeydown="if(event.key==='Enter'&&this.value.trim()&&!Qs.done)answer()">`}
if(Qs.done){b+=`<h3>${ok?"✅ 正解":"❌ 不正解"}</h3>`+(q.t==="cmd"?`<div>正解例:<code>${esc(q.ans[0])}</code></div>${q.ans.length>1?`<div class="dim">省略形なども正解:${q.ans.slice(1).map(a=>"<code>"+esc(a)+"</code>").join(" ")}</div>`:""}`:`<div>正しい順序:<br>${q.items.map((t,n)=>(n+1)+". "+t).join("<br>")}</div>`)+`<p>${q.e}</p>`+(L[q.u]?`<button class="btn s" onclick="go('lesson','${q.u}')">関連する学習内容を見る</button>`:"")}
app.innerHTML=hd+`<div class="card">${b}</div>`+(Qs.done?`<button class="btn" onclick="Qs.i++;Qs.p=null;Qs.done=false;Qs.sel=null;Qs.txt='';Qs.sh=null;view()">次へ</button>`:`<button id="cb" class="btn" ${can?"":"disabled"} onclick="answer()">回答する</button>`)}

/* 計算問題(毎回ランダムに生成・途中式つき) */
function gen(){const p=24+Math.floor(Math.random()*7),n=Math.pow(2,32-p);
if(Math.random()<.5){const c=n-2,ops=[c,n,n-1,n-4];const s=[...new Set(ops)].sort(()=>Math.random()-.5);
return{id:"g"+Date.now()+Math.random(),u:"3-9",q:"/"+p+" のネットワークで、利用可能なホストアドレス数はいくつですか。",o:s.map(String),a:s.indexOf(c),e:"ホスト部=32−"+p+"="+(32-p)+"ビット。2^"+(32-p)+"="+n+"。ネットワークとブロードキャストの2個を引いて "+n+"−2="+c+" です。",w:s.map(v=>v==c?"正解です。":"この値は計算の途中や引き算のミスで出る値です。")}}
const x=Math.floor(Math.random()*256),m=256-n,net=x-x%n,ops=[net,net+n-1,x,net+n].map(v=>Math.min(v,255));const s=[...new Set(ops)];
return{id:"g"+Date.now()+Math.random(),u:"3-9",q:"192.168.1."+x+"/"+p+" が属するネットワークアドレスはどれですか。",o:s.map(v=>"192.168.1."+v),a:s.indexOf(net),e:"サブネットマスクの最終オクテットは"+m+"。ブロックサイズは256−"+m+"="+n+"。"+x+"は "+net+"〜"+(net+n-1)+" の範囲なので、ネットワークアドレスは192.168.1."+net+" です。",w:s.map(v=>v==net?"正解です。":"ブロックの先頭ではない値です。")}}

const KEY="ccnaMasterLab.v1";
const DEF=()=>({read:{},ans:[],days:{},sess:[],pts:0,spent:0,owned:["wall0","floor0","desk0"],placed:{wall:"wall0",floor:"floor0",desk:"desk0"},claimed:[],ach:[],mocks:[],act:null,goal:30,mode:25});
let S;try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=DEF()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("保存できませんでした(ブラウザの設定を確認してください)")}};
const $=s=>document.querySelector(s),app=$("#app");
const day=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=s=>{s=Math.floor(s);return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const mm=s=>Math.floor(s/60)+"分";
const tot=()=>Object.values(S.days).reduce((a,b)=>a+b,0);
const latest=()=>{const m={};S.ans.forEach(a=>m[a.q]=a);return m};
const acc=l=>l.length?Math.round(l.filter(a=>a.ok).length/l.length*100):null;
const status=id=>{const q=L[id]?L[id].q:[];if(!L[id])return"none";if(!S.read[id])return"未学習";const lt=latest();const ans=q.map((_,i)=>lt[id+"#"+i]).filter(Boolean);return ans.length===q.length&&ans.filter(a=>a.ok).length/q.length>=.6?"学習完了":"学習中"};
const streak=()=>{let n=0,d=new Date();if(!S.days[day(d)])d.setDate(d.getDate()-1);while(S.days[day(d)]>0){n++;d.setDate(d.getDate()-1)}return n};
const bal=()=>S.pts-S.spent;

function tEnd(){const a=S.act;if(a.run)a.acc+=Date.now()-a.run;let sec=Math.floor(a.acc/1000);S.act=null;

sec=Math.min(sec,4*3600);const d=day(new Date(a.t0));const before=S.days[d]||0;S.days[d]=before+sec;

function rec(){const m=new Date(),n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();let bars="",mx=1;for(let i=1;i<=n;i++)mx=Math.max(mx,S.days[m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(i).padStart(2,"0")]||0);
for(let i=1;i<=n;i++){const v=S.days[m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(i).padStart(2,"0")]||0,h=Math.round(v/mx*100);bars+=`<rect x="${(i-1)*11+2}" y="${110-h}" width="8" height="${h}" fill="#1d6fd8"/>`}
app.innerHTML=`<h2>学習記録</h2><div class="card"><b>今月の学習時間(日別)</b><svg viewBox="0 0 ${n*11+4} 116"><line x1="0" y1="111" x2="${n*11+4}" y2="111" stroke="#cfdbec"/>${bars}</svg><div class="dim">最大 ${mm(mx)}/日。記録した時間だけを表示します。</div></div>
<div class="card"><b>実績</b>${ACH.map(a=>`<div>${S.ach.includes(a[0])?"🏆":"🔒"} ${a[1]}</div>`).join("")}</div>
<div class="card"><b>直近の学習セッション</b>${S.sess.slice(-8).reverse().map(s=>`<div class="dim">${new Date(s.t0).toLocaleString()} ・ ${mm(s.sec)}</div>`).join("")||"まだありません"}</div>
<div class="card"><b>データの保存</b><div class="dim">データはこのブラウザ内にだけ保存されます。ブラウザのデータを消すと記録も消えるため、時々バックアップしてください。</div><button class="btn" onclick="exp()">バックアップを書き出す</button><label class="btn s" style="display:inline-block">復元する<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button class="btn d" onclick="reset()">データを初期化</button></div>`}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="ccna_backup_"+day()+".json";a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),D=DEF();
if(typeof d!=="object"||!d)throw 0;for(const k of["read","days"])if(typeof d[k]!=="object")throw 0;for(const k of["ans","sess","owned","claimed","ach","mocks"])if(!Array.isArray(d[k]))throw 0;
if(![d.pts,d.spent,d.goal].every(Number.isFinite)||d.spent>d.pts)throw 0;if(!d.owned.every(o=>IID(o)))throw 0;
const pl={};for(const[s,i]of Object.entries(d.placed||{}))if(IID(i)&&IID(i).s===s&&d.owned.includes(i))pl[s]=i;
if(!confirm("現在のデータを上書きして復元します。よろしいですか?"))return;
S=Object.assign(D,{read:d.read,days:d.days,ans:d.ans.filter(a=>a&&typeof a.q==="string"),sess:d.sess,pts:d.pts,spent:d.spent,owned:d.owned,placed:pl,claimed:d.claimed.map(String),ach:d.ach.map(String),mocks:d.mocks,goal:d.goal,act:null});save();toast("復元しました");view()}catch(e){toast("このファイルは復元できません(形式が正しくありません)")}};r.readAsText(f)}
function reset(){if(confirm("すべての学習データを削除します。元に戻せません。本当に初期化しますか?")&&confirm("最終確認:バックアップは取りましたか?初期化を実行します。")){S=DEF();save();go("home")}}
window.addEventListener("error",e=>console.error(e.message));
checkRewards();view();
</script></body></html>
