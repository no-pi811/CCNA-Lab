function home(){const w=weekSec(),done=UID.filter(u=>status(u)==="学習完了").length,total=UID.length,lt=latest(),as=Object.values(lt),lvl=1+Math.floor(Math.sqrt(tot()/1800)),next=Math.pow(lvl,2)*1800-0;
const nm=MS.find(m=>tot()<m[0]*3600),rest=nm?Math.ceil((nm[0]*3600-tot())/60):0;
app.innerHTML=`<div class="card">${room(S.placed)}<div class="row" style="margin-top:8px"><b>Lv.${lvl}</b><span class="sp"></span><span>💎 ${bal()}pt</span></div><div class="bar"><i style="width:${Math.min(100,Math.round(tot()/Math.pow(lvl,2)/18))}%"></i></div><div class="dim">${nm?"次の報酬まであと"+(rest>=60?Math.floor(rest/60)+"時間":"")+rest%60+"分の学習":"すべての累計報酬を獲得済み"}</div></div>
<div class="grid"><div class="stat"><b>${fmt(S.days[day()]||0)}</b>今日</div><div class="stat"><b>${mm(w)}</b>今週</div><div class="stat"><b>${(tot()/3600).toFixed(1)}h</b>累計</div><div class="stat"><b>${streak()}日</b>連続</div><div class="stat"><b>${acc(as)===null?"--":acc(as)+"%"}</b>正答率</div><div class="stat"><b>${done}/${total}</b>学習完了単元</div></div>
<div class="card"><b>今日の目標 ${S.goal}分</b><div class="bar"><i style="width:${Math.min(100,Math.round((S.days[day()]||0)/S.goal/.6))}%"></i></div><div class="dim">収録済みの単元は全${Object.keys(L).length}単元(全${UID.length}単元の構成のうち)。お休みの日があっても、いつでも再開できます。</div></div>
<button class="btn" onclick="go('lesson',nextUnit())">学習を続ける</button><button class="btn s" onclick="go('units')">単元一覧</button><button class="btn s" onclick="go('quiz',{m:'all'})">確認問題</button><button class="btn s" onclick="go('review')">苦手問題の復習</button><button class="btn s" onclick="go('mock')">模擬試験</button><button class="btn s" onclick="go('rec')">学習記録</button>`}
function weekSec(){let s=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);s+=S.days[day(d)]||0}return s}
const nextUnit=()=>UID.find(k=>L[k]&&status(k)!=="学習完了")||Object.keys(L)[0];
function units(){app.innerHTML=`<h2>単元一覧</h2><p class="dim">初心者は第1章から順に進めるのがおすすめです。ボタンになっている単元はすぐ学べます。</p><div class="card dim">対象試験:CCNA 200-301 v1.1(2026-10-26時点)。二次情報によると、v2.0が2027年2月3日に開始予定です。公式の最新情報はCisco Learning Networkの試験範囲ページで必ず確認してください(このアプリは外部サイトを自動取得しません)。収録問題はすべてオリジナルで、実際の試験問題ではありません。</div>`+CH.map((c,i)=>`<div class="card"><b>第${i+1}章 ${c[0]}</b>`+c[1].map((u,j)=>{const id=i+1+"-"+(j+1),st=status(id);return st==="none"?`<div class="dim" style="padding:4px 0">${j+1}. ${u} (今後追加予定)</div>`:`<button class="opt" onclick="go('lesson','${id}')">${j+1}. ${u} <span class="tag ${st==="学習完了"?"ok":""}">${st}</span></button>`}).join("")+`</div>`).join("")}
function lesson(){const id=cur.x||nextUnit(),t=L[id];if(!t){go("units");return}
app.innerHTML=`<h2>${NAME(id)}</h2><span class="tag">${status(id)}</span>
<div class="card"><h3>学習目標</h3>${t.g}<h3>解説</h3>${t.b}<h3>身近な例え</h3>${t.an}<h3>具体例</h3>${t.ex}<h3>重要用語</h3>${t.tm}<h3>試験で狙われやすいポイント</h3>${t.pt}<h3>よくある勘違い</h3>${t.mi}<div class="dim" style="margin-top:10px">${SRC}</div></div>
<button class="btn" onclick="S.read['${id}']=1;save();go('quiz',{m:'unit',u:'${id}'})">確認問題へ(${t.q.length}問)</button><button class="btn s" onclick="go('units')">単元一覧へ</button>`}
function startQ(list){Qs={l:list,i:0,p:null,done:false,res:[],exam:false}}
function quiz(){const x=cur.x||{};if(x.m){let l=x.m==="unit"?BANK.filter(q=>q.u===x.u):x.m==="wrong"?wrongList():BANK.slice().sort(()=>Math.random()-.5).slice(0,8);if(x.m==="all")l.push(gen(),gen());startQ(l);cur.x={}}
if(!Qs||!Qs.l.length){app.innerHTML=`<div class="card">出題できる問題がありません。</div><button class="btn" onclick="go('units')">単元一覧へ</button>`;return}
if(Qs.i>=Qs.l.length){const ok=Qs.res.filter(Boolean).length;app.innerHTML=`<div class="card"><h2>結果 ${ok}/${Qs.l.length}</h2></div><button class="btn" onclick="go('home')">ホーム</button><button class="btn s" onclick="go('review')">復習へ</button>`;return}
const q=Qs.l[Qs.i];app.innerHTML=`<div class="dim">${Qs.i+1}/${Qs.l.length}・${NAME(q.u)}・難易度${"★".repeat(q.d||1)}・オリジナル練習問題</div><div class="card"><b>${q.q}</b>`+q.o.map((o,i)=>`<button class="opt ${Qs.done?(i===q.a?"ok":i===Qs.p?"ng":""):Qs.p===i?"sel":""}" ${Qs.done?"disabled":""} onclick="Qs.p=${i};view()">${o}${Qs.done?`<div class="dim">${q.w[i]||""}</div>`:""}</button>`).join("")+(Qs.done?`<h3>${Qs.p===q.a?"✅ 正解":"❌ 不正解"}</h3>${q.e}${L[q.u]?`<div><button class="btn s" onclick="go('lesson','${q.u}')">関連する学習内容を見る</button></div>`:""}`:"")+`</div>`+(Qs.done?`<button class="btn" onclick="Qs.i++;Qs.p=null;Qs.done=false;view()">次へ</button>`:`<button class="btn" ${Qs.p===null?"disabled":""} onclick="answer()">回答する</button>`)}
function answer(){const q=Qs.l[Qs.i],ok=Qs.p===q.a;Qs.done=true;Qs.res.push(ok);S.ans.push({q:q.id,u:q.u,ok,t:Date.now()});checkRewards();view()}
function wrongList(){const lt=latest();return BANK.filter(q=>lt[q.id]&&!lt[q.id].ok)}
function review(){const w=wrongList(),by={};S.ans.forEach(a=>{(by[a.u]=by[a.u]||[]).push(a)});
const weak=Object.keys(by).filter(u=>by[u].length>=3&&acc(by[u])<70);
app.innerHTML=`<h2>復習</h2><div class="card"><b>間違えたまま(最新の回答)の問題:${w.length}問</b>${w.map(q=>`<div class="dim">・${q.q.slice(0,40)}…</div>`).join("")}</div><button class="btn" ${w.length?"":"disabled"} onclick="go('quiz',{m:'wrong'})">間違えた問題だけを解く</button><button class="btn s" onclick="go('quiz',{m:'all'})">全問から再挑戦+計算問題</button><button class="btn s" onclick="go('quiz',{m:'unit',u:'3-7'})">サブネット計算の練習</button>
<div class="card"><b>苦手分野</b><div class="dim">回答3問以上で正答率70%未満の単元のみ表示します(問題数が少ないうちは判定しません)。</div>${weak.length?weak.map(u=>`<div>${NAME(u)}:${acc(by[u])}%</div>`).join(""):"<div>現在、苦手と判定された単元はありません。</div>"}</div>`}
function timer(){const a=S.act;app.innerHTML=`<h2>学習タイマー</h2><div class="card"><div class="timer" id="tm">${fmt(el()/1000)}</div><div class="dim" style="text-align:center" id="rem">${a?"":"モードを選んで開始"}</div>
<div class="row">${a?(a.run?`<button class="btn s" onclick="tPause()">一時停止</button>`:`<button class="btn" onclick="tResume()">学習再開</button>`):`<button class="btn" onclick="tStart()">学習開始</button>`}<button class="btn d" ${a?"":"disabled"} onclick="tEnd()">学習終了</button></div>
<div class="row">${[25,50,0].map(m=>`<button class="opt" style="width:auto;${S.mode===m?"border-color:var(--b)":""}" ${a?"disabled":""} onclick="S.mode=${m};save();view()">${m?m+"分":"自由"}</button>`).join("")}</div>
<div class="dim">一時停止中は加算されません。10分ごとに10pt、最大4時間/回。休憩(5分)は、いったん「学習終了」して取るのがおすすめです。タブを閉じても進行中の記録は復元されます。</div></div>
<div class="card">今日:${mm(S.days[day()]||0)}/目標${S.goal}分 <button class="btn s" onclick="const v=+prompt('1日の目標(分)',S.goal);if(v>0&&v<=600){S.goal=v;save();view()}">目標を変更</button></div>`}
function roomV(){const slots=[["wall","壁紙"],["floor","床"],["desk","机"],["pc","パソコン"],["plant","植物"],["lamp","照明"],["clock","時計"],["poster","ポスター"],["toy","ぬいぐるみ"],["shelf","本棚"],["rug","カーペット"],["trophy","トロフィー"]];
app.innerHTML=`<h2>私の学習部屋 💎${bal()}pt</h2><div class="card">${room(S.placed)}</div><h3>ショップ</h3><div class="shop">${IT.map(shopItem).join("")}</div>`}
function mock(){if(window.mockEnd){return mockRun()}app.innerHTML=`<h2>模擬試験</h2><div class="card">収録済みの問題からランダムに出題します(計算問題を含む)。試験中は正解や解説を表示しません。<br><b>制限時間:15分</b><div class="dim">「学習上の目標スコア」は75%に設定していますが、これは本アプリの目安で、公式の合格基準ではありません。公式の合格点・出題範囲はシスコの公式サイトで確認してください。</div></div><button class="btn" onclick="mockStart()">開始する</button>
${S.mocks.length?"<h3>過去の成績</h3>"+S.mocks.slice(-5).reverse().map(m=>`<div class="card">${new Date(m.t).toLocaleDateString()} ${m.ok}/${m.n}(${Math.round(m.ok/m.n*100)}%)</div>`).join(""):""}`}
let M=null;
function mockStart(){const l=BANK.slice().sort(()=>Math.random()-.5);for(let i=0;i<4;i++)l.push(gen());M={l:l.sort(()=>Math.random()-.5).slice(0,12),a:{},i:0};window.mockEnd=Date.now()+15*60000;mockRun()}
function mockRun(){const q=M.l[M.i];app.innerHTML=`<div class="row"><b>${M.i+1}/${M.l.length}</b><span class="sp"></span><b id="mt">${fmt(Math.max(0,(window.mockEnd-Date.now())/1000))}</b></div><div class="card"><b>${q.q}</b>`+q.o.map((o,i)=>`<button class="opt ${M.a[M.i]===i?"sel":""}" onclick="M.a[M.i]=${i};mockRun()">${o}</button>`).join("")+`</div><button class="btn s" ${M.i?"":"disabled"} onclick="M.i--;mockRun()">前へ</button><button class="btn s" ${M.i<M.l.length-1?"":"disabled"} onclick="M.i++;mockRun()">次へ</button><button class="btn d" onclick="if(confirm('未回答は不正解として採点します。終了しますか?'))mockFinish()">採点する</button><div class="dim">未回答:${M.l.filter((_,i)=>M.a[i]===undefined).map((_,i)=>"").length?M.l.map((_,i)=>M.a[i]===undefined?i+1:"").filter(Boolean).join(", "):"なし"}(番号は問題番号)</div>`}
function mockFinish(){if(!window.mockEnd)return;window.mockEnd=null;let ok=0;const wrong=[];M.l.forEach((q,i)=>{const c=M.a[i]===q.a;S.ans.push({q:q.id,u:q.u,ok:c,t:Date.now()});c?ok++:wrong.push([q,M.a[i]])});S.mocks.push({t:Date.now(),ok,n:M.l.length});checkRewards();
const by={};M.l.forEach((q,i)=>{const c=NAME(q.u).slice(0,0)+q.u.split("-")[0];by[c]=by[c]||[0,0];by[c][1]++;if(M.a[i]===q.a)by[c][0]++});
app.innerHTML=`<h2>結果 ${ok}/${M.l.length}(${Math.round(ok/M.l.length*100)}%)</h2><div class="card"><b>章別の正答率</b>${Object.keys(by).map(c=>`<div>第${c}章:${by[c][0]}/${by[c][1]}</div>`).join("")}<div class="dim">目標スコア(学習上の目安):75%</div></div>`+wrong.map(([q,a])=>`<div class="card"><b>${q.q}</b><div>あなたの回答:${a===undefined?"未回答":q.o[a]}</div><div>正解:${q.o[q.a]}</div><div class="dim">${q.e}</div></div>`).join("")+`<button class="btn" onclick="go('mock')">もう一度挑戦</button>`}
function rec(){const m=new Date(),n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();let bars="",mx=1;for(let i=1;i<=n;i++)mx=Math.max(mx,S.days[m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(i).padStart(2,"0")]||0);
for(let i=1;i<=n;i++){const v=S.days[m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(i).padStart(2,"0")]||0,h=Math.round(v/mx*100);bars+=`<rect x="${(i-1)*11+2}" y="${110-h}" width="8" height="${h}" fill="#1d6fd8"/>`}
app.innerHTML=`<h2>学習記録</h2><div class="card"><b>今月の学習時間(日別)</b><svg viewBox="0 0 ${n*11+4} 116"><line x1="0" y1="111" x2="${n*11+4}" y2="111" stroke="#cfdbec"/>${bars}</svg><div class="dim">最大 ${mm(mx)}/日。記録した時間だけを表示します。</div></div>
<div class="card"><b>実績</b>${ACH.map(a=>`<div>${S.ach.includes(a[0])?"🏆":"🔒"} ${a[1]}</div>`).join("")}</div>
<div class="card"><b>直近の学習セッション</b>${S.sess.slice(-8).reverse().map(s=>`<div class="dim">${new Date(s.t0).toLocaleString()} ・ ${mm(s.sec)}</div>`).join("")||"まだありません"}</div>
<div class="card"><b>データの保存</b><div class="dim">データはこのブラウザ内にだけ保存されます。ブラウザのデータを消すと記録も消えるため、時々バックアップしてください。</div><button class="btn" onclick="exp()">バックアップを書き出す</button><label class="btn s" style="display:inline-block">復元する<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button class="btn d" onclick="reset()">データを初期化</button></div>`}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="ccna_backup_"+day()+".json";a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),D=DEF();
if(typeof d!=="object"||!d)throw 0;for(const k of["read","days"])if(typeof d[k]!=="object")throw 0;for(const k of["ans","sess","owned","claimed","ach","mocks"])if(!Array.isArray(d[k]))throw 0;
if(![d.pts,d.spent,d.goal].every(Number.isFinite)||d.spent>d.pts)throw 0;if(!d.owned.every(o=>IID(o)))throw 0;
const pl={};for(const[s,i]of Object.entries(d.placed||{}))if(IID(i)&&IID(i).s===s&&d.owned.includes(i))pl[s]=i;
if(!confirm("現在のデータを上書きして復元します。よろしいですか?"))return;
S=Object.assign(D,{read:d.read,days:d.days,ans:d.ans.filter(a=>a&&typeof a.q==="string"),sess:d.sess,pts:d.pts,spent:d.spent,owned:d.owned,placed:pl,claimed:d.claimed.map(String),ach:d.ach.map(String),mocks:d.mocks,goal:d.goal,act:null});save();toast("復元しました");view()}catch(e){toast("このファイルは復元できません(形式が正しくありません)")}};r.readAsText(f)}
function reset(){if(confirm("すべての学習データを削除します。元に戻せません。本当に初期化しますか?")&&confirm("最終確認:バックアップは取りましたか?初期化を実行します。")){S=DEF();save();go("home")}}
window.addEventListener("error",e=>console.error(e.message));
checkRewards();view();
</script></body></html>
